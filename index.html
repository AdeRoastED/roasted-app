<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoastED - Grammar that sticks</title>
    <style>
        :root {
            --bg-color: #F8F5EE;
            --text-dark: #101828;
            --text-muted: #475467;
            --accent-red: #D93025;
            --btn-red-hover: #C22A21;
            --card-border: #E4E7EC;
            --card-shadow: rgba(16, 24, 40, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 40px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr;
            gap: 64px;
        }

        @media (min-width: 992px) {
            .container {
                grid-template-columns: 1fr 1fr;
                align-items: center;
                gap: 80px;
            }
        }

        .header {
            padding: 20px 40px;
            display: flex;
            align-items: center;
        }

        .lang-badge {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            background-color: #E6EDFB;
            color: #1A3F9C;
            font-size: 14px;
            font-weight: 500;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hero-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .headline {
            font-size: 40px;
            line-height: 1.2;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0;
            letter-spacing: -1.5px;
        }

        .headline .highlight {
            font-family: "Georgia", serif;
            color: var(--accent-red);
            font-style: italic;
            font-weight: 400;
        }

        @media (min-width: 1200px) {
            .headline {
                font-size: 56px;
            }
        }

        .subtitle {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-muted);
            margin: 0;
        }

        .buttons-container {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }

        .btn-roasted {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 16px 28px;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 48, 37, 0.3);
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-roasted:hover {
            background-color: var(--btn-red-hover);
        }

        .btn-drill {
            background-color: white;
            color: var(--text-dark);
            border: 1px solid var(--card-border);
            padding: 16px 28px;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 4px var(--card-shadow);
            transition: border-color 0.2s;
        }

        .btn-drill:hover {
            border-color: #98A2B3;
        }

        .illustration-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-wrapper {
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(16, 24, 40, 0.1);
            border: 1px solid var(--card-border);
            background-color: white;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="lang-badge">ENGLISH GB • ITALIANO IT</div>
    </header>

    <main class="container">
        <section class="hero-section">
            <h1 class="headline">
                Grammar that <span class="highlight">sticks</span><br>
                because it stings.
            </h1>
            <p class="subtitle">
                Forget boring conjugation tables. Write a sentence in<br>
                English or Italian and our AI tutor corrects it — with a<br>
                roast you’ll never forget. Mistakes you laugh at are<br>
                mistakes you don’t repeat.
            </p>

            <div class="buttons-container">
                <button class="btn-roasted"><span>🔥</span> Get roasted</button>
                <button class="btn-drill">Try a quick drill</button>
            </div>
        </section>

        <section class="illustration-section">
            <div class="image-wrapper">
                <img src="illustration.png" alt="RoastED illustration">
            </div>
        </section>
    </main>

</body>
</html>
