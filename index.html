<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoastED</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <img class="banner" src="images/banner.webp" alt="RoastED">
  <div class="selector-container">
    <div class="selector-row"><span class="selector-label" id="natLbl"></span><div class="selector-options" id="natOpts"></div></div>
    <div class="selector-row"><span class="selector-label" id="tgtLbl"></span><div class="selector-options" id="tgtOpts"></div></div>
  </div>
  <section class="illustration-section">
    <div class="image-card" id="imageCard">
      <div class="image-wrapper"><img id="charImg" alt="Tutor"></div>
      <div class="character-caption" id="caption"></div>
    </div>
  </section>
  <section class="hero-section">
    <h1 class="headline" id="headline"></h1>
    <p class="subtitle" id="sub"></p>
    <div class="topics-container" id="topics"></div>
  </section>
  <section class="drill-section">
    <div class="drill-header"><h3 class="section-title" id="drillT"></h3><span class="progress-indicator" id="prog"></span></div>
    <div class="question-box" id="qbox"></div>
    <div class="options-grid" id="opts"></div>
    <div class="roast-feedback" id="fb"></div>
    <button class="next-question-btn" id="nextBtn"></button>
  </section>
  <section class="custom-roast-section">
    <h3 class="section-title" id="fixT"></h3>
    <p class="custom-desc" id="fixD"></p>
    <div class="question-box bq" id="bq"></div>
    <textarea id="fixIn"></textarea>
    <button class="btn-roasted" id="fixBtn"></button>
    <div class="custom-result-output" id="fixOut"></div>
    <button class="btn-roasted again" id="newBtn"></button>
  </section>
</div>
<script src="data/it.js"></script>
<script src="data/en.js"></script>
<script src="data/fr.js"></script>
<script src="data/de.js"></script>
<script src="app.js"></script>
</body>
</html>
