<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>roastED - Bilingual English-Italian Drills</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #f43f5e;
            --accent-hover: #e11d48;
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        header h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            color: var(--accent-color);
        }
        header p {
            margin: 0 0 20px 0;
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .filter-container {
            margin-bottom: 20px;
        }
        .filter-container label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background-color: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-size: 1rem;
        }
        .question-box {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            border-color: var(--accent-color);
        }
        .roast-feedback {
            padding: 14px;
            border-radius: 8px;
            background-color: #27272a;
            border-left: 4px solid var(--accent-color);
            margin-top: 15px;
            font-size: 0.95rem;
            display: none;
        }
        .next-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            display: none;
        }
        .next-btn:hover {
            background-color: var(--accent-hover);
        }
        .progress-indicator {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>roastED</h1>
            <p>100 bilingual drills across your 5 core topics with per-option roasts.</p>
        </header>

        <div class="filter-container">
            <label for="topicFilter">Filter by Topic:</label>
            <select id="topicFilter" onchange="filterQuestions()">
                <option value="all">All Topics (100 Questions)</option>
                <option value="Travels">Travels (20 Questions)</option>
                <option value="Geography">Geography (20 Questions)</option>
                <option value="Food">Food (20 Questions)</option>

        </div>

        <div class="progress-indicator" id="progressIndicator">Question 1 of 100</div>
        <div class="question-box" id="questionText">Loading question...</div>
        <div class="options-list" id="optionsList"></div>
        <div class="roast-feedback" id="roastFeedback"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question</button>
    </div>

            { topic: "Culture", q: "Translate: 'Architecture'", options: [{ text: "Architettura", correct: true, roast: "Correct." }, { text: "Scultura", correct: false, roast: "Sculpture." }] },
            { topic: "Culture", q: "Translate: 'Theatre'", options: [{ text: "Spettacolo teatrale", correct: true, roast: "Correct." }, { text: "Concerto", correct: false, roast: "Concert." }] },
            { topic: "Culture", q: "Translate: 'Tradition'", options: [{ text: "Tradizione", correct: true, roast: "Correct." }, { text: "Innovazione", correct: false, roast: "Tech." }] },
            { topic: "Culture", q: "Translate: 'Ancient ruins'", options: [{ text: "Rovine antiche", correct: true, roast: "Correct." }, { text: "Edificio moderno", correct: false, roast: "Modern." }] },
            { topic: "Culture", q: "Translate: 'Vatican Museums'", options: [{ text: "Musei Vaticani", correct: true, roast: "Correct." }, { text: "Uffizi", correct: false, roast: "Florence." }] },
            { topic: "Culture", q: "Translate: 'Classical music'", options: [{ text: "Musica classica", correct: true, roast: "Correct." }, { text: "Pop", correct: false, roast: "Pop." }] },
            { topic: "Culture", q: "Translate: 'Cultural heritage'", options: [{ text: "Patrimonio culturale", correct: true, roast: "Correct." }, { text: "Monumento", correct: false, roast: "Monument." }] }
        ];

        let currentFilteredQuestions = [...questions];
        let currentIndex = 0;

        function filterQuestions() {
            const selectedTopic = document.getElementById("topicFilter").value;
            if (selectedTopic === "all") {
                currentFilteredQuestions = [...questions];
            } else {
                currentFilteredQuestions = questions.filter(q => q.topic === selectedTopic);
            }
            currentIndex = 0;
            loadQuestion();
        }

        function loadQuestion() {
            const qObj = currentFilteredQuestions[currentIndex];
            if (!qObj) return;

            document.getElementById("progressIndicator").innerText = `Question ${currentIndex + 1} of ${currentFilteredQuestions.length} (${qObj.topic})`;
            document.getElementById("questionText").innerText = qObj.q;
            
            const optionsList = document.getElementById("optionsList");
            optionsList.innerHTML = "";
            
            document.getElementById("roastFeedback").style.display = "none";
            document.getElementById("nextBtn").style.display = "none";

            qObj.options.forEach((opt) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt);
                optionsList.appendChild(btn);
            });
        }

        function selectOption(opt) {
            const feedback = document.getElementById("roastFeedback");
            feedback.style.display = "block";
            feedback.style.borderColor = opt.correct ? "#10b981" : "var(--accent-color)";
            feedback.innerHTML = `<strong>${opt.correct ? 'Correct!' : 'Incorrect.'}</strong> ${opt.roast}`;
            document.getElementById("nextBtn").style.display = "block";
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex >= currentFilteredQuestions.length) {
                currentIndex = 0;
            }
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
